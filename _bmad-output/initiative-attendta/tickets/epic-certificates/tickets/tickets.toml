[[entry]]
id = 4
type = "story"
title = "Create certificate reviews in event completion transaction"
description = "Implements IEventCompletionHandler, which epic-events-registration's completion transaction (3.12) declares and calls inside its own transaction, inserting through CertificateRepository a pending_approval certificate review for each Registration with Valid Attendance (ParticipationFacts, AD-5) under the event lock completion already holds, with created_by set to the completing officer and no file or PDF work, delivering R1."
verify = "Completing an event creates pending_approval review rows for every Registration with Valid Attendance and none for absent or invalidated attendance, all in the completion's database transaction, and a completion that fails rolls back every review."
covers = ["R1"]
after = ["1.2", "1.3", "3.12"]
hitl = false
risk = "medium"
phase = "integration"
area = "backend"
queue = 290
notes = ["Use the mapped attendance table and canonical Valid Attendance fact; implementation can start once the completion hook exists without waiting for scanner UI or the recording engine. Final integration 8.11 still requires real attendance end to end.", "Removes demo data M-10a (2026-11-06 demo rescope): implement the real source behind the contract the demo provider serves, delete the provider classes and their registration, and set the rows to `removed` with the commit in `demo-mock-register.md`. The screen should not change visibly. No per-ticket Impeccable critique or polish; 8.12 covers it."]
references = ["_bmad-output/initiative-attendta/delivery-queue.md", "_bmad-output/initiative-attendta/finale-test-cases.md", "_bmad-output/initiative-attendta/demo-mock-register.md"]

