[[entry]]
id = 3
type = "story"
title = "Caller-owned transaction unit of work and append-only Activity Log writer"
description = "Implements the caller-owned transaction unit of work participating in repository operations and the shared Activity Log writer that appends validated audit JSON inside the caller's transaction while filtering sensitive secrets, hashes, tokens, and paths."
verify = "An integration test verifies that business writes and audit logs commit atomically inside a caller transaction, roll back completely on error, refuse credentials or paths, and that SQL Server permissions reject direct UPDATE or DELETE operations on activity_logs."
covers = ["R5"]
after = [2]
hitl = false
risk = "high"

