[[entry]]
id = 8
type = "story"
title = "Read-only newest-first paged Activity Log viewer"
description = "Builds the read-only Activity Log screen for the Administrator policy, paged with PageRequest and the shared _Pager at 25 rows (AD-13), ordered occurred_at DESC, log_id DESC. Each row shows occurred time through the shared Asia/Manila formatter (AD-11, epic-platform-access entry 1.4), actor name and type, action, affected entity type and id, and reason. The screen has no edit or delete control."
