# AttendTa epics in build order. Owners follow prd addendum C; see each epic file's Notes.
# Shared requirements: R33 (audit) — e1 builds the writer and append-only enforcement, every other epic logs its own actions, e5 adds the viewer.
# R36 (pager) — e1 builds the helper and pages the request queue; every epic pages its own lists.
# R13 — e3 completes the Event and closes Check-in; e6 creates Certificate Reviews in that transaction.
# R20 — e3 My Events registrations and status; e4 QR Pass and attendance state; e6 certificate download links.
# R25 — e4 invalidation, reason and re-check-in refusal; e6 not_eligible effect and serialization with issuance.
# R5 — e2 edits every Member field except membership status; e5 owns the membership-status change with its FR-32 preview and cascade.
# R8 — e2 builds the shared image storage and Venue photos; e3 uploads and replaces Event Covers through it.

[[epic]]
id = 1
slug = "epic-platform-access"
title = "Members sign in to a real, audited platform"
description = "On the dev build an admin created by the setup script approves an Account Request and the new Member logs in by email to a role-routed Tailwind shell; the canonical schema with lookup FKs, Argon2id hasher, transactional audit writer and 25-row pager are in place, and the login stub, AES passwords, public Register and Bootstrap are gone."
covers = ["R1", "R2", "R3", "R33", "R35", "R36"]

[[epic]]
id = 2
slug = "epic-master-data"
title = "Management maintains members, event types and venues"
description = "Logged-in Management edits Member Profiles (except membership status), Event Types and Venues with photos through the shared 2 MiB private image storage, each change audited and paged, and a Member sees their own read-only profile."
covers = ["R4", "R5", "R6", "R7", "R8", "R33", "R36"]
after = [{ epic = 1, needs = "email login issuing role and numeric actor claims, the audit writer, the pager and the canonical schema" }]

[[epic]]
id = 3
slug = "epic-events-registration"
title = "Officers publish events and fill seats fairly"
description = "Management runs an Event from draft through publish, edit, cancel and complete; Eligible Participants register before the deadline; reviews, Promotion and cancellations allocate Seats without overbooking and respect the start cutoff through one Registration-owned cancellation service; Members see their Registrations in My Events."
covers = ["R8", "R9", "R10", "R11", "R12", "R13", "R14", "R15", "R16", "R17", "R18", "R19", "R20", "R33", "R36"]
after = [{ epic = 1, needs = "the audit writer, the pager and the local-time display helper" }, { epic = 2, needs = "active Event Types and Venues, the shared image storage for Event Covers, and Member eligibility facts" }]

[[epic]]
id = 4
slug = "epic-check-in"
title = "Confirmed members get a QR Pass and officers record attendance"
description = "A confirmed Member downloads a QR Pass PNG; Management opens Check-in, scans (laptop camera on localhost) or looks up participants, records exactly one Attendance Record per Registration, and invalidates mistakes; Members see their attendance."
covers = ["R20", "R21", "R22", "R23", "R24", "R25", "R26", "R33", "R36"]
after = [{ epic = 3, needs = "Confirmed Registrations carrying QR tokens, the Event check-in flag and the My Events page" }]

[[epic]]
id = 5
slug = "epic-administration"
title = "Administrators control roles, access and the audit trail"
description = "An Administrator changes Roles and Account access, Management changes membership status, both with a preview, reason and cancellation of upcoming Registrations through the Registration cancellation service, the last Administrator is protected, and the Activity Log is viewable newest-first."
covers = ["R5", "R31", "R32", "R33", "R34", "R36"]
after = [{ epic = 1, needs = "the pager, shell and audit writer for the accounts and log screens" }, { epic = 2, needs = "the Member edit screen whose membership-status control this epic replaces" }, { epic = 3, needs = "the Registration-owned participation cancellation service" }, { epic = 4, needs = "Valid Attendance facts that exempt Registrations from cancellation" }]

[[epic]]
id = 6
slug = "epic-certificates"
title = "Officers issue retained PDF certificates"
description = "Completing an Event creates Certificate Reviews for valid attendees; Management approves or declines each, issues one fixed-template A4 PDF at a time, and the owner or Management downloads it from My Events through an authorized endpoint, with attendance corrections serialized against issuance."
covers = ["R13", "R20", "R25", "R27", "R28", "R29", "R33", "R36"]
after = [{ epic = 1, needs = "the canonical certificates mapping" }, { epic = 2, needs = "the shared private storage adapter for the certificates directory" }, { epic = 3, needs = "the completion transaction and the My Events page" }, { epic = 4, needs = "Attendance Records with invalidation" }]

[[epic]]
id = 7
slug = "epic-participation-reports"
title = "Officers read per-event participation reports"
description = "Management opens a per-Event report showing Registrations by status, Confirmed and Valid attendees, No-shows, attendance rate, attendee course/year distribution and paged detail rows, all from canonical facts."
covers = ["R30", "R36"]
after = [{ epic = 1, needs = "the role-aware shell and the pager" }, { epic = 3, needs = "Registration states, signup snapshots and Completed Events" }, { epic = 4, needs = "Attendance Records with invalidation" }]

[[epic]]
id = 8
slug = "epic-release-acceptance"
title = "The integrated build passes SPEC §20 and is demo-ready"
description = "Delivers the initiative's Done when: every SPEC §20 scenario (SM-1) and all 26 functional IDs (SM-2) pass on the integrated dev build, the owners' concurrency tests run green together (SM-4), the demo host serves trusted HTTPS for phone scanning over the hotspot with storage and SQL that survive redeploy and restore (NFR-4, NFR-6, Q2), and dev is released to main after Tier 3 E2E (SM-3)."
covers = []
after = [{ epic = 1, needs = "the finished platform epic for the acceptance run" }, { epic = 2, needs = "the finished master-data epic for the acceptance run" }, { epic = 3, needs = "seat-allocation concurrency tests and the finished epic" }, { epic = 4, needs = "the camera scanner, attendance concurrency tests and the finished epic" }, { epic = 5, needs = "deactivation and audit for UJ-5" }, { epic = 6, needs = "Playwright runtime, certificate issuance and its concurrency tests" }, { epic = 7, needs = "reports for the full journey" }]
