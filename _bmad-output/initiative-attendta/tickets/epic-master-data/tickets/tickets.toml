[[entry]]
id = 1
type = "story"
title = "Event Type management with required description, audit logging, and paged Tailwind list"
description = "Brings Event Type create, edit, and active toggle to the canonical schema with a required non-blank description and unique trimmed name, adding LockEventTypeAsync on EventTypeRepository and taking the event_types row lock for each write (deactivation takes the event_types row lock then reads linked events), reading the actor from ICurrentActor under the Management policy, mapping the DomainException outcomes that platform-access entry 11 introduced to field errors, stamping times from TimeProvider, logging old and new values through IActivityLogWriter, and displaying the list with the 25-row shared pager in the Tailwind shell."
verify = "An Officer creates an Event Type with a required description, sees it in the 25-row paged Tailwind table ordered by name with an id tie-break, edits its name and description, toggles its status, and verifies that each action appends an activity_logs entry with old and new values; a duplicate name or blank description is refused with a field error."
covers = ["R3", "R6", "R7"]
after = ["1.1", "1.3", "1.6", "1.11"]
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Shared IPrivateFileStore with venue, event, certificate and temporary areas and authorized photo route"
description = "Generalizes VenueImageStorage into IPrivateFileStore, declared in Services and implemented in WebApp/Storage under Common:SetupRoot outside wwwroot, with SaveAsync, CreateTemporaryPath, PromoteAsync, OpenReadAsync and Delete keyed by area: uploads/venues and uploads/events accept JPEG or PNG checked by magic bytes up to 2 MiB, certificates accepts only %PDF-, and temporary holds renderer output; filenames are server-generated GUIDs opened with CreateNew, SQL stores area-prefixed relative paths, every open and delete passes a containment check, existing venues rows are rewritten from venues/… to uploads/venues/… by an idempotent SQL script under database/ shipped in the same PR, venue photos are served only through a Management-policy action, and AGENTS.md and docs/database-setup.md are corrected from 5 MiB to 2 MiB with the new path form. Consumers: epic-events-registration entry 2 (Event Covers) and epic-certificates entries 1 and 7 (temporary and certificates areas)."
verify = "A Management-policy Officer uploads a 2 MiB JPEG venue photo that renders through the photo route; a file one byte over 2 MiB, a non-image with a .jpg name, and an anonymous photo request are each refused; an integration test promotes a temporary file into certificates and refuses a certificates write that does not start with %PDF-; a migrated venues row reading uploads/venues/… still renders; and AGENTS.md and docs/database-setup.md state 2 MiB and the uploads/venues path form."
covers = ["R5"]
after = ["1.1", "1.3"]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Venue create and edit with required photo, replacement-on-commit, and capacity guard"
description = "Implements Venue create and edit with positive capacity and a required area-prefixed photo path from IPrivateFileStore; adds LockVenueAsync on VenueRepository and takes the venues row lock before the edit; VenueService owns the replacement order (write the new file, commit inside ExecuteInTransactionAsync, delete the old file only after the commit, delete the new file if the commit fails), refuses a capacity below the participant limit of any linked draft or published Event through a Data read query, throws DomainException, and logs changes without image paths."
verify = "An Officer creates a venue with a photo and edits its details; in an IntegrationTests database where a test SQL fixture inserts a published events row with participant_limit 30 linked to the venue, an edit to capacity 29 is refused with an Invalid outcome on capacity; a second connection holding the venue lock delays the edit until it is released; a forced commit failure keeps the old photo file and removes the new one; and successful changes append activity_logs entries containing no image path."
covers = ["R4", "R5", "R6"]
after = ["1.3", "1.9", "1.11", 2]
hitl = false
risk = "medium"

[[entry]]
id = 4
