<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: light-dark(#ffffff, #121212); color-scheme: light dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1221px" height="402px" viewBox="0 0 1221 402"><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c2"><g><rect x="0" y="0" width="1220" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#0f172a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: light-dark(rgb(15, 23, 42), rgb(211, 218, 234));"><text x="2" y="21.5">AD-3 · AD-4 · AD-7 · AD-9 — anatomy of every mutating use case</text></g></g></g><g data-cell-id="c3"><g transform="translate(0.5,0.5)"><rect x="10" y="70" width="150" height="110" rx="13.2" ry="13.2" fill="#dbeafe" stroke="#1d4ed8" pointer-events="all" style="fill: light-dark(rgb(219, 234, 254), rgb(26, 39, 56)); stroke: light-dark(rgb(29, 78, 216), rgb(129, 171, 255));"/></g><g><g fill="#0f172a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(15, 23, 42), rgb(211, 218, 234));"><text x="85" y="109">1 · Controller</text><text x="85" y="123">POST + antiforgery</text><text x="85" y="137">binds request model</text><text x="85" y="151">(no actor id)</text></g></g></g><g data-cell-id="c4"><g transform="translate(0.5,0.5)"><rect x="184" y="70" width="150" height="110" rx="13.2" ry="13.2" fill="#ffedd5" stroke="#c2410c" pointer-events="all" style="fill: light-dark(rgb(255, 237, 213), rgb(45, 30, 9)); stroke: light-dark(rgb(194, 65, 12), rgb(251, 140, 94));"/></g><g><g fill="#0f172a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(15, 23, 42), rgb(211, 218, 234));"><text x="259" y="109">2 · ExecuteIn-</text><text x="259" y="123">TransactionAsync</text><text x="259" y="137">one transaction</text><text x="259" y="151">RCSI · no auto-retry</text></g></g></g><g data-cell-id="c5"><g transform="translate(0.5,0.5)"><rect x="358" y="70" width="150" height="110" rx="13.2" ry="13.2" fill="#fee2e2" stroke="#b91c1c" pointer-events="all" style="fill: light-dark(rgb(254, 226, 226), rgb(57, 33, 33)); stroke: light-dark(rgb(185, 28, 28), rgb(255, 156, 156));"/></g><g><g fill="#0f172a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(15, 23, 42), rgb(211, 218, 234));"><text x="433" y="109">3 · Lock…Async</text><text x="433" y="123">PK seeks, AD-4 order</text><text x="433" y="137">users → types →</text><text x="433" y="151">venues → events</text></g></g></g><g data-cell-id="c6"><g transform="translate(0.5,0.5)"><rect x="532" y="70" width="150" height="110" rx="13.2" ry="13.2" fill="#ede9fe" stroke="#6d28d9" pointer-events="all" style="fill: light-dark(rgb(237, 233, 254), rgb(37, 33, 51)); stroke: light-dark(rgb(109, 40, 217), rgb(216, 156, 255));"/></g><g><g fill="#0f172a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(15, 23, 42), rgb(211, 218, 234));"><text x="607" y="116">4 · Recheck</text><text x="607" y="130">ParticipationFacts</text><text x="607" y="144">TimeProvider guards</text></g></g></g><g data-cell-id="c7"><g transform="translate(0.5,0.5)"><rect x="706" y="70" width="150" height="110" rx="13.2" ry="13.2" fill="#ccfbf1" stroke="#0f766e" pointer-events="all" style="fill: light-dark(rgb(204, 251, 241), rgb(0, 40, 31)); stroke: light-dark(rgb(15, 118, 110), rgb(86, 174, 167));"/></g><g><g fill="#0f172a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(15, 23, 42), rgb(211, 218, 234));"><text x="781" y="116">5 · Mutate + hooks</text><text x="781" y="130">owner repo only</text><text x="781" y="144">flush for identity ids</text></g></g></g><g data-cell-id="c8"><g transform="translate(0.5,0.5)"><rect x="880" y="70" width="150" height="110" rx="13.2" ry="13.2" fill="#dcfce7" stroke="#15803d" pointer-events="all" style="fill: light-dark(rgb(220, 252, 231), rgb(7, 35, 17)); stroke: light-dark(rgb(21, 128, 61), rgb(82, 174, 116));"/></g><g><g fill="#0f172a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(15, 23, 42), rgb(211, 218, 234));"><text x="955" y="109">6 · Audit</text><text x="955" y="123">IActivityLogWriter</text><text x="955" y="137">.Append — same</text><text x="955" y="151">transaction</text></g></g></g><g data-cell-id="c9"><g transform="translate(0.5,0.5)"><rect x="1054" y="70" width="150" height="110" rx="13.2" ry="13.2" fill="#f1f5f9" stroke="#475569" pointer-events="all" style="fill: light-dark(rgb(241, 245, 249), rgb(23, 27, 30)); stroke: light-dark(rgb(71, 85, 105), rgb(155, 167, 184));"/></g><g><g fill="#0f172a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(15, 23, 42), rgb(211, 218, 234));"><text x="1129" y="109">7 · Commit</text><text x="1129" y="123">then delete replaced</text><text x="1129" y="137">file · PRG redirect</text><text x="1129" y="151">or JSON</text></g></g></g><g data-cell-id="c10"><g><path d="M 160 125 L 173.76 125" fill="none" stroke="#334155" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(51, 65, 85), rgb(172, 184, 201));"/><path d="M 181.76 125 L 173.76 129 L 173.76 121 Z" fill="#334155" stroke="#334155" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(51, 65, 85), rgb(172, 184, 201)); stroke: light-dark(rgb(51, 65, 85), rgb(172, 184, 201));"/></g></g><g data-cell-id="c11"><g><path d="M 334 125 L 347.76 125" fill="none" stroke="#334155" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(51, 65, 85), rgb(172, 184, 201));"/><path d="M 355.76 125 L 347.76 129 L 347.76 121 Z" fill="#334155" stroke="#334155" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(51, 65, 85), rgb(172, 184, 201)); stroke: light-dark(rgb(51, 65, 85), rgb(172, 184, 201));"/></g></g><g data-cell-id="c12"><g><path d="M 508 125 L 521.76 125" fill="none" stroke="#334155" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(51, 65, 85), rgb(172, 184, 201));"/><path d="M 529.76 125 L 521.76 129 L 521.76 121 Z" fill="#334155" stroke="#334155" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(51, 65, 85), rgb(172, 184, 201)); stroke: light-dark(rgb(51, 65, 85), rgb(172, 184, 201));"/></g></g><g data-cell-id="c13"><g><path d="M 682 125 L 695.76 125" fill="none" stroke="#334155" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(51, 65, 85), rgb(172, 184, 201));"/><path d="M 703.76 125 L 695.76 129 L 695.76 121 Z" fill="#334155" stroke="#334155" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(51, 65, 85), rgb(172, 184, 201)); stroke: light-dark(rgb(51, 65, 85), rgb(172, 184, 201));"/></g></g><g data-cell-id="c14"><g><path d="M 856 125 L 869.76 125" fill="none" stroke="#334155" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(51, 65, 85), rgb(172, 184, 201));"/><path d="M 877.76 125 L 869.76 129 L 869.76 121 Z" fill="#334155" stroke="#334155" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(51, 65, 85), rgb(172, 184, 201)); stroke: light-dark(rgb(51, 65, 85), rgb(172, 184, 201));"/></g></g><g data-cell-id="c15"><g><path d="M 1030 125 L 1043.76 125" fill="none" stroke="#334155" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(51, 65, 85), rgb(172, 184, 201));"/><path d="M 1051.76 125 L 1043.76 129 L 1043.76 121 Z" fill="#334155" stroke="#334155" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(51, 65, 85), rgb(172, 184, 201)); stroke: light-dark(rgb(51, 65, 85), rgb(172, 184, 201));"/></g></g><g data-cell-id="c16"><g transform="translate(0.5,0.5)"><rect x="10" y="240" width="1194" height="70" rx="8.4" ry="8.4" fill="#fee2e2" stroke="#b91c1c" pointer-events="all" style="fill: light-dark(rgb(254, 226, 226), rgb(57, 33, 33)); stroke: light-dark(rgb(185, 28, 28), rgb(255, 156, 156));"/></g><g><g fill="#0f172a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(15, 23, 42), rgb(211, 218, 234));"><text x="607" y="273">Failure at any step → rollback · ChangeTracker.Clear() · throw DomainException(OutcomeCode)</text><text x="607" y="287">Invalid · Forbidden · NotFound · Stale · Duplicate (SQL 2601/2627) · CapacityUnavailable · CutoffPassed · FileFailure</text></g></g></g><g data-cell-id="c17"><g><path d="M 607 180 L 607 229.76" fill="none" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" pointer-events="stroke" style="stroke: light-dark(rgb(185, 28, 28), rgb(255, 156, 156));"/><path d="M 607 237.76 L 603 229.76 L 611 229.76 Z" fill="#b91c1c" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(185, 28, 28), rgb(255, 156, 156)); stroke: light-dark(rgb(185, 28, 28), rgb(255, 156, 156));"/></g><g><g fill="#b91c1c" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(185, 28, 28), rgb(255, 156, 156));"><rect fill="#ffffff" stroke="none" x="552" y="204" width="111" height="15" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="607" y="215">Stale / CutoffPassed</text></g></g></g><g data-cell-id="c18"><g transform="translate(0.5,0.5)"><rect x="10" y="340" width="1194" height="60" rx="7.2" ry="7.2" fill="#f8fafc" stroke="#94a3b8" pointer-events="all" style="fill: light-dark(rgb(248, 250, 252), rgb(21, 23, 25)); stroke: light-dark(rgb(148, 163, 184), rgb(87, 100, 118));"/></g><g><g fill="#0f172a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(15, 23, 42), rgb(211, 218, 234));"><text x="607" y="375">Files (AD-12): write the new file in its area (or render the PDF to temporary/) BEFORE the transaction; never render or do file I/O while holding a lock; on rollback delete the new file.</text></g></g></g></g></g></g></svg>