[[entry]]
id = 1
type = "story"
title = "Event selector and participation summary KPIs"
description = "Delivers the report pipeline from coherent read queries to a role-gated Tailwind view, displaying an event selector and per-event summary KPIs including registration status counts, Confirmed count, Valid attendee count (excluding invalidated attendance), and attendance rate with decimal rounding and N/A on zero Confirmed; provides the base report view for no-shows, distributions, and detail rows; needs canonical schema, role claims, and Tailwind shell from epic-platform-access, event and registration entities from epic-events-registration, and attendance records with invalidation from epic-check-in."
verify = "Sign in as an officer, open /Report, select an event, and verify summary cards display status counts, Confirmed count, Valid attendees (excluding invalidated attendance), and attendance rate (or N/A when zero Confirmed) matching database records."
covers = ["R1"]
after = ["1.9", "3.12", "4.6"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Completed-event no-shows and signup snapshot attendee distributions"
description = "Extends the entry 1 report view to calculate Completed-only no-shows (excluding pending, waitlisted, and cancelled registrations from expected attendance and no-shows), handle cancelled events with historical counts only (omitting attendance rate and no-shows), and derive actual-attendee course and year distributions strictly from signup snapshots while preserving inactive member history."
verify = "View a completed event to verify no-shows count matches Confirmed minus Valid attendees (excluding pending, waitlisted, and cancelled registrations), view a cancelled event to confirm no-shows and rate are omitted, and verify course and year distributions reflect actual attendees using their signup snapshots even if member accounts or records are inactive."
covers = ["R1"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Paged participant detail rows with full-dataset totals"
description = "Extends the report view with server-side 25-row paged participant detail rows with FR-30 fields (name, student number, snapshot course, registration status, attendance result, Manila check-in time) and status filtering while preserving full-dataset summary totals and entry 2 attendee distributions across pages; needs the shared 25-row pager component from epic-platform-access."
verify = "Navigate through 25-row pages of participant detail rows on a completed event, verifying columns show name, student number, snapshot course, status, attendance result, and Manila check-in time, while full-dataset totals and distributions remain unchanged."
covers = ["R1", "R2"]
after = [2, "1.6"]
hitl = false
risk = "low"
