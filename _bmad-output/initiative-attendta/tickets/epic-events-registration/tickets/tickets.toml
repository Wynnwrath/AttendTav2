[[entry]]
id = 1
type = "story"
title = "Draft event creation, edit, and management event list"
description = "Creates and edits draft Events through `IEventLifecycleService` with active type and venue validation under the event type → venue → event lock order (adds `EventRepository.LockEventAsync(id)` here per AD-4), a positive limit within venue capacity and a Signup Deadline no later than start, appending `event.updated` Activity Log entries on edits, showing draft Events on the paged management list while hiding them from members; uses the canonical EF mappings, the audit writer, the pager and the local-time helper from epic-platform-access, and active types and venues from epic-master-data."
verify = "The user runs the dev build with the setup-script officer account and walks the verify: creates a draft event with an active type and venue, sees it appear on the paged management events list, edits its title with an event.updated audit entry recorded, observes that creating or editing a draft with an inactive Event Type or Venue is refused via 2.5 active read queries, and verifies a non-officer cannot access or view the draft."
covers = ["R1", "R15"]
after = ["2.5", "1.3", "1.4", "1.6"]
hitl = true
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Event Cover upload, replacement, and draft removal via shared storage"
description = "Integrates Event Cover management with `IPrivateFileStore` from epic-master-data (area `uploads/events`, JPEG or PNG checked by magic bytes, at most 2 MiB) for upload and replacement on draft and published Events, draft cover removal that clears `image_path` and deletes the file after commit, and an authorized cover-serving action for Management and Members; the file path never appears in audit values."
verify = "An officer uploads a valid JPEG cover to a draft Event, removes it while in draft, re-uploads a PNG cover, and an oversized or non-image file is rejected with a validation error; a Member loads the cover only through the authorized action, and no static path to the file is served."
covers = ["R13"]
after = [1, "2.2"]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Event publication with active master revalidation and activity audit"
description = "Creates `ASI.Basecode.Data/Queries/ParticipationFacts.cs` with all AD-5 canonical facts (Publishable, Eligible Participant, Valid Attendance, Seat held, Waitlist priority, Event Start Cutoff passed, Signup open, No-show, Attendance rate) consumed downstream by epic-check-in, epic-certificates, and epic-participation-reports (which reads No-show and Attendance rate). Publishes a draft Event through `IEventLifecycleService` under the event type → venue → event lock order, revalidating `ParticipationFacts.Publishable` (active type and venue, `image_path` set, `participant_limit` within venue capacity, `registration_deadline` after the injected `TimeProvider`'s now), then appending an `event.published` Activity Log entry in the same transaction and opening signup in the member feed."
verify = "Services.Tests verify all canonical ParticipationFacts expressions with a fake TimeProvider; an officer publishes a draft Event with a valid cover and future deadline, observing its status change to Published with an `event.published` Activity Log entry, while a draft with a deactivated venue, missing cover or past deadline is refused publication."
covers = ["R2", "R14"]
after = [2, "2.3", "2.5"]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Published event limited edits and immutable states"
description = "Restricts updates on Published Events to title, description and Cover replacement through `IEventLifecycleService` under the event type → venue → event lock order, logging old and new title and description values and recording a cover replacement with no file path in `event.updated`, while locking Completed and Cancelled Events as read-only."
verify = "An officer updates the title and description of a Published Event and sees the change with old and new values in the Activity Log, a cover replacement appears there without any file path, and server validation rejects changes to schedule, venue, limit or deadline."
covers = ["R3", "R14"]
after = [3]
hitl = false
risk = "low"

