[[entry]]
id = 1
type = "story"
title = "Console accounts list with role and status badges"
description = "Renders the paged Accounts and Roles console for the Administrator policy, showing each account's name, email, role name (roles lookup via users.role_id), active status and action links, with the shared 25-row pager and Tailwind shell from epic-platform-access. Filters apply before counting."
verify = "Given at least 26 user accounts seeded in the database, an Administrator logs in, opens Console Accounts & Roles, and sees a 25-row paged table of users with correct role and status badges, working page navigation, and functional search filtering."
covers = ["R6"]
after = ["1.1", "1.2", "1.6", "1.9"]
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Role assignment with last-active-Administrator app lock"
description = "Enables an Administrator to assign the Member, Officer, or Administrator Role to an Account with a mandatory reason (users.role_id, roles lookup) under the Administrator policy, in one ExecuteInTransactionAsync. When the target is an active Administrator and the new role is not Administrator, it first takes sp_getapplock 'attendta:last-admin' (Exclusive, owner Transaction, bounded @LockTimeout; a negative return throws Stale), then locks the target's users row, then re-reads the target and counts active Administrators; rejecting demotions of the last active Administrator with explanatory feedback. Each change appends one user.role_assigned Activity Log entry with old and new role codes in the same transaction."
verify = "An integration test in ASI.Basecode.IntegrationTests (AD-17), with parallel connections against ATTENDTA_TEST_SQL, has two connections each demote one of two active Administrators; exactly one succeeds, the other is refused with explanatory feedback, and one Administrator stays active. A valid role change updates users.role_id, appends one activity_logs row in the same transaction, and the Administrator sees the new role badge on the Console Accounts list."
covers = ["R2", "R4"]
after = [1, "1.1", "1.2", "1.3"]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Upcoming registration impact preview for deactivation"
description = "Adds the deactivation preview to the Account access screen: a GET endpoint and dialog that call IRegistrationCancellationService.PreviewUpcomingForUserAsync from epic-events-registration (AD-6) and list the upcoming, not-yet-started Registrations without Valid Attendance that the deactivation would cancel. The preview takes no lock and writes nothing; the Administration module adds no query of its own. Entry 6 reuses this endpoint for membership deactivation."
verify = "In ASI.Basecode.IntegrationTests, requesting the deactivation preview for a user registered for two upcoming un-attended events and one already-attended event (with attendance verified via a seeded attendance row) displays a modal listing only the two affected upcoming registrations."
covers = ["R3"]
after = [1, "3.15"]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Account deactivation with registration cancellation cascade and session refusal"
description = "Applies Account deactivation with a mandatory reason in one ExecuteInTransactionAsync under the Administrator policy. When the target is an active Administrator it takes the app lock attendta:last-admin (AD-4 step 1; refusing deactivation if the target is the last active Administrator), then locks the target's users row, then calls IRegistrationCancellationService.CancelUpcomingForUserAsync(userId, AccountDeactivated, reason) from epic-events-registration (AD-6), which cancels the upcoming Registrations, clears their QR tokens and locks their events in ascending order. It then sets users.is_active to false and appends one user.deactivated Activity Log entry. Session refusal on the next request comes from epic-platform-access's OnValidatePrincipal (AD-8); this entry adds no session code and only verifies it. The confirm step opens the entry 3 preview dialog. It replaces 5.11's demo account commands."
verify = "Executing the UJ-5 flow, deactivating an officer account with a valid reason cancels their upcoming registrations, releases their seats without auto-promoting waitlisted members, records an attributable activity log entry, and immediately refuses their active session on their next request. An integration test in ASI.Basecode.IntegrationTests with parallel connections runs two account deactivations of the two active Administrators at once; exactly one succeeds and one Administrator stays active."
covers = ["R3", "R4"]
after = [2, 3, 11, "1.1", "3.15"]
hitl = false
risk = "medium"
phase = "integration"
area = "backend"
queue = 250
references = ["_bmad-output/initiative-attendta/delivery-queue.md", "_bmad-output/initiative-attendta/finale-test-cases.md", "_bmad-output/initiative-attendta/demo-mock-register.md"]
notes = ["Removes demo data M-14a (2026-11-06 demo rescope): implement the real source behind the contract the demo provider serves, delete the provider classes and their registration, and set the rows to `removed` with the commit in `demo-mock-register.md`. The screen should not change visibly. No per-ticket Impeccable critique or polish; 8.12 covers it."]

