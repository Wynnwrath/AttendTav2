references = ["docs/DESIGN.md", "_bmad-output/initiative-attendta/delivery-queue.md", "_bmad-output/initiative-attendta/demo-mock-register.md", "docs/demo-host-setup.md"]
notes = ["Demo phase (2026-11-06 demo rescope): frontend only. Use the real backend where a service method exists and demo data per demo-mock-register.md (rows M-01, M-04, M-09) where it does not; nothing on screen may show that data is demo data. Add or fill this ticket's register rows in the same pull request.", "Done check: dotnet build and one run of the startup refusal with the switch on against a non-demo database. The one automated test is the database refusal, because a wrongly enabled switch on a live host would fake check-ins and certificates. No other new automated tests, no per-ticket Impeccable critique or polish and no separate code-review pass; the pull request keeps green existing CI and one peer approval. Critique, polish and the full Verify line run once in 8.15.", "Decision: 2026-11-06 — review of the demo rescope: split from 1.13 so the shell and the seam run in parallel; adds the startup database guard, stable pass tokens, the real refusal rules and the event-status overlay. No GitHub issue exists for this entry yet; the tracker sync creates it.", "8.13 removes M-01 after every other register row is removed; 3.12 removes M-09 and 4.2 removes M-04."]
