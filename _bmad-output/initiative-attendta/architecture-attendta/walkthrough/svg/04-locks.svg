ight-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(51, 65, 85), rgb(172, 184, 201));"/></g><g><g fill="#0f172a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(15, 23, 42), rgb(211, 218, 234));"><text x="820" y="506">Deactivation cancelling registrations (R32)</text><text x="820" y="520">users → events ascending</text></g></g></g><g data-cell-id="c17"><g><rect x="20" y="550" width="1020" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#475569" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: light-dark(rgb(71, 85, 105), rgb(155, 167, 184));"><text x="22" y="570">Queue picks: discover → lock → recheck; if the candidate changed → rollback + Stale.</text></g></g></g></g></g></g></svg>