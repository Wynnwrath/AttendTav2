[[entry]]
id = 6
type = "story"
title = "Management certificate review queue and approval decisions"
description = "Implements the 25-row paged review queue on the shared PageRequest and _Pager (AD-13), and the approve and decline decisions: each discovers its candidate, locks the owner's users row and then the event, rechecks pending_approval status and Valid Attendance through ParticipationFacts, and refuses as Stale a candidate that changed; decline displays the SPEC §14.2 warning that the decision cannot be reopened in this release and requires a non-blank reason validated inside the transaction; each decision appends a certificate.approved or certificate.declined entry, delivering R8, R4 and R7."
verify = "An Officer approves a pending review to mark it eligible and declines another with a required reason to make it not_eligible; both append Activity Log entries, a decline without a reason is refused and the queue shows 25 rows per page. A focused fixture-backed guard check proves a changed/non-pending review is refused as Stale without mutation; the actual invalidation-versus-decision flow is verified after 6.5 at the finale."
covers = ["R4", "R7", "R8"]
after = [4, 5, 12, "1.3", "1.6", "1.9"]
hitl = false
risk = "medium"
phase = "integration"
area = "backend"
queue = 350
notes = ["Wire the 6.12 ledger contract with real read/decision sources, not a second screen. Review commands recheck Valid Attendance; 6.5 protects invalidation and must be present before issuance in 6.7.", "Removes demo data M-10b (2026-11-06 demo rescope): implement the real source behind the contract the demo provider serves, delete the provider classes and their registration, and set the rows to `removed` with the commit in `demo-mock-register.md`. The screen should not change visibly. No per-ticket Impeccable critique or polish; 8.12 covers it."]
references = ["_bmad-output/initiative-attendta/delivery-queue.md", "_bmad-output/initiative-attendta/finale-test-cases.md", "_bmad-output/initiative-attendta/demo-mock-register.md"]

[[entry]]
id = 7
type = "story"
title = "Transactional certificate issuance pipeline and audit"
description = "Wire 6.12's 25-row paged issuance queue/control to the real query and use case: pre-check issued state outside locks; render using the existing fixed template with a unique number; write/promote through IPrivateFileStore; then in one caller-owned transaction lock owner user, event and certificate, recheck approval, Valid Attendance and Completed status, and save certificate_number, retained snapshots, issuer_name_snapshot, relative file_path, issuer/time and certificate.issued audit. Rendering/file I/O stays outside locks. Failed commit deletes the new file; retry never replaces an issued PDF. Implement the invalidation guard from 6.5 before enabling issuance. Critical real-SQL race authoring is centralized in 8.5, execution in 8.4; use a PDF test double for lock tests and the installed Chromium for renderer checks."
verify = "Focused development check: one eligible issuance persists the retained PDF and snapshots/audit, and a duplicate attempt leaves its bytes unchanged. Finale cases CERT-01/02 in finale-test-cases.md must prove exactly one issuance under concurrent requests and a safe invalidation-versus-issuance outcome before release."
covers = ["R3", "R5", "R7", "R8"]
after = [2, 3, 5, 6, "1.3", "1.6", "1.9", "2.2"]
hitl = false
risk = "high"
phase = "integration"
area = "backend"
queue = 360
references = ["_bmad-output/initiative-attendta/delivery-queue.md", "_bmad-output/initiative-attendta/finale-test-cases.md", "_bmad-output/initiative-attendta/demo-mock-register.md"]
notes = ["Removes demo data M-11a (2026-11-06 demo rescope): implement the real source behind the contract the demo provider serves, delete the provider classes and their registration, and set the rows to `removed` with the commit in `demo-mock-register.md`. The screen should not change visibly. No per-ticket Impeccable critique or polish; 8.12 covers it."]

