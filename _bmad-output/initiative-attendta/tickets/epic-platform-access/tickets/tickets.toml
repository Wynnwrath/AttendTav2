[[entry]]
id = 14
type = "story"
title = "Demo data seam with startup database guard"
description = "Build the demo data seam described in demo-mock-register.md (rows M-01, M-04 and M-09; rules 2, 4, 5, 7, 8, 9 and 10). Read DemoData:Enabled in any environment, off in committed settings. When it is on, refuse to start unless the connected database's name is AttendTa_Demo or exactly equals DemoData:AllowDatabase, and unless DemoData:TokenKey is set; log the reason and show nothing on screen. Create one in-memory demo store keyed by real record ids for the state several surfaces read: event check-in open and completed state, pass tokens (HMAC-SHA256 of the registration id under DemoData:TokenKey, stable across restarts), attendance records, certificate reviews and issues, and account and membership status. Apply the invalidation rule inside the store: invalidating an attendance turns its pending or approved review not eligible with the reason, and is refused when the certificate is issued. Create the demo data folder with one registration method that calls one registration file per surface. Seed scenarios at start-up from records already in the connected database: a published event with check-in open and confirmed registrations, a started event ready to complete, and a completed event with check-ins (one invalidated) and a pending, a declined and an issued certificate; write the seed's starting state into the register for demo-script.md. Provide the two event-state commands with the real refusal rules (open/close check-in M-04, complete event M-09), the shared open/close check-in control partial that the dossier and scanner use, and the overlay of the Completed status and check-in flag on the officer event list, member feed and event detail. Record each screen's real and demo sources and file boundaries in the register before the surface tickets start."
verify = "With DemoData__Enabled=true, AllowDatabase unset and a database other than AttendTa_Demo, the app refuses to start and logs why; the same with AllowDatabase naming the connected database starts, and so does AttendTa_Demo. A missing TokenKey also refuses startup. One automated integration test proves the database refusal. With the app running, the seeded event list, feed and detail show Completed and check-in state after the commands run; completing a cancelled event, completing before start and opening check-in on an unpublished event are refused; a pass token is the same after a restart. No demo command writes SQL rows, stored files or Activity Log entries. With the switch unset the screens show their normal state and the existing test suites pass."
covers = []
