[[entry]]
id = 1
type = "story"
title = "Draft event creation, edit, and management event list"
description = "Creates and edits draft Events through `IEventLifecycleService` with active type and venue validation under the event type → venue → event lock order (adds `EventRepository.LockEventAsync(id)` here per AD-4), a positive limit within venue capacity and a Signup Deadline no later than start, appending `event.updated` Activity Log entries on edits, showing draft Events on the paged management list while hiding them from members; uses the canonical EF mappings, the audit writer, the pager and the local-time helper from epic-platform-access, and active types and venues from epic-master-data."
verify = "The user runs the dev build with the setup-script officer account and walks the verify: creates a draft event with an active type and venue, sees it appear on the paged management events list, edits its title with an event.updated audit entry recorded, observes that creating or editing a draft with an inactive Event Type or Venue is refused via 2.5 active read queries, and verifies a non-officer cannot access or view the draft."
covers = ["R1", "R15"]
after = ["2.5", "1.3", "1.4", "1.6"]
hitl = true
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Event Cover upload, replacement, and draft removal via shared storage"
description = "Integrates Event Cover management with `IPrivateFileStore` from epic-master-data (area `uploads/events`, JPEG or PNG checked by magic bytes, at most 2 MiB) for upload and replacement on draft and published Events, draft cover removal that clears `image_path` and deletes the file after commit, and an authorized cover-serving action for Management and Members; the file path never appears in audit values."
verify = "An officer uploads a valid JPEG cover to a draft Event, removes it while in draft, re-uploads a PNG cover, and an oversized or non-image file is rejected with a validation error; a Member loads the cover only through the authorized action, and no static path to the file is served."
covers = ["R13"]
after = [1, "2.2"]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Event publication with active master revalidation and activity audit"
description = "Creates `ASI.Basecode.Data/Queries/ParticipationFacts.cs` with all AD-5 canonical facts (Publishable, Eligible Participant, Valid Attendance, Seat held, Waitlist priority, Event Start Cutoff passed, Signup open, No-show, Attendance rate) consumed downstream by epic-check-in, epic-certificates, and epic-participation-reports (which reads No-show and Attendance rate). Publishes a draft Event through `IEventLifecycleService` under the event type → venue → event lock order, revalidating `ParticipationFacts.Publishable` (active type and venue, `image_path` set, `participant_limit` within venue capacity, `registration_deadline` after the injected `TimeProvider`'s now), then appending an `event.published` Activity Log entry in the same transaction and opening signup in the member feed."
verify = "Services.Tests verify all canonical ParticipationFacts expressions with a fake TimeProvider; an officer publishes a draft Event with a valid cover and future deadline, observing its status change to Published with an `event.published` Activity Log entry, while a draft with a deactivated venue, missing cover or past deadline is refused publication."
covers = ["R2", "R14"]
after = [2, "2.3", "2.5"]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Published event limited edits and immutable states"
description = "Restricts updates on Published Events to title, description and Cover replacement through `IEventLifecycleService` under the event type → venue → event lock order, logging old and new title and description values and recording a cover replacement with no file path in `event.updated`, while locking Completed and Cancelled Events as read-only."
verify = "An officer updates the title and description of a Published Event and sees the change with old and new values in the Activity Log, a cover replacement appears there without any file path, and server validation rejects changes to schedule, venue, limit or deadline."
covers = ["R3", "R14"]
after = [3]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Member event browsing and registration submission with academic snapshot"
description = "Displays published events on the paged member feed and registers an Eligible Participant for a Published Event before its Signup Deadline under the owner's `users` row and then the event lock (registrations are written under the event lock only per AD-4 step 7), enforcing `ParticipationFacts` Signup open and Eligible Participant against the injected `TimeProvider` (refusing with `CutoffPassed`), creating a pending Registration with course, year and section snapshots, warning when Confirmed rows reach the participant limit, and refusing a second Registration for the same Member and Event through the `registrations(event_id, member_id)` unique key (`Duplicate`) even after cancellation."
verify = "An eligible member registers for a published event before the deadline, receives a Pending registration with academic snapshot saved, sees a full-event warning when capacity is reached, and a second registration attempt for the same event is refused with Duplicate; registration attempts when Signup open is false are refused with CutoffPassed."
covers = ["R6", "R15"]
after = [3, "1.4"]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Signup deadline enforcement at exact local boundary"
description = "Proves the Signup Deadline at its exact boundary for stale submissions: `ParticipationFacts` Signup open at the instant of the deadline is tested in Services.Tests with a fake `TimeProvider`, and the closure shows the deadline in Asia/Manila; earlier registrations remain intact and the Event stays Published in the feed."
verify = "A member attempting to register one tick before the deadline succeeds, and at or after the deadline receives an explicit closure refusal; earlier registrations remain intact and the Event remains Published in the feed."
covers = ["R7"]
after = [5]
hitl = false
risk = "low"

[[entry]]
id = 15
type = "story"
title = "Registration-owned participation cancellation service (AD-6)"
description = "Creates `IRegistrationCancellationService` with `CancelRegistrationAsync`, `CancelAllForEventAsync`, `CancelUpcomingForUserAsync` and `PreviewUpcomingForUserAsync`, plus the `CancellationCause` enum (`MemberRequested`, `Declined`, `AdminCancelled`, `EventCancelled`, `MembershipDeactivated`, `AccountDeactivated`), as the only code that sets a registration to Cancelled: each cancelled row clears `qr_token` and records `cancelled_by`, `cancelled_at` and `cancellation_reason`, writes one `registration.cancelled` entry, leaves already-Cancelled rows unchanged, and promotes nothing; the deactivation pair treats Upcoming as not yet started with no Valid Attendance and locks affected events in ascending id order under the caller's `users` row, with the reason validated inside the transaction. Epic-administration entries 3 and 6 call PreviewUpcomingForUserAsync; entries 4 and 6 call CancelUpcomingForUserAsync."
verify = "Services.Tests with a fake `TimeProvider` cover the Upcoming rule and the preview list, and an IntegrationTests run cancels one account's upcoming registrations across two events, asserting ascending event lock order, cleared QR tokens, one `registration.cancelled` entry per row, unchanged earlier cancellations and no promoted waitlisted registration."
covers = []
after = [5]
hitl = false
risk = "high"

[[entry]]
id = 7
type = "story"
title = "Registration review and transactional seat allocation with SQL Server concurrency test"
description = "Implements officer review of Pending Registrations before the Event Start Cutoff under the owner's `users` row and then the event lock, rechecking that the Event remains Published and the member remains an Eligible Participant (SPEC §9.2, §10). Approval confirms with a 64-lowercase-hex QR token generated from 32 cryptographically random bytes when `ParticipationFacts` Seat held is below `participant_limit` and no earlier eligible Waitlisted Registration has priority (`reviewed_at ASC, registration_id ASC`), otherwise it waitlists, writing a `registration.approved` Activity Log entry; decline and administrative cancellation of Confirmed or Waitlisted rows without Valid Attendance validate reasons in-transaction, call `IRegistrationCancellationService` (`Declined`, `AdminCancelled`), and write their own caller audit entries (`registration.declined` or `registration.admin_cancelled`) alongside the service's per-row cancellation log; `reviewed_by` and `reviewed_at` are stamped; the review queue is paged at 25 rows; and an integration test proves concurrent last-seat approvals never overbook."
verify = "An IntegrationTests run in `tests/ASI.Basecode.IntegrationTests` executes concurrent approval requests for the final seat against SQL Server with zero overbooking; an officer in the browser approves a registration to confirm it with a 64-hex QR token and sees registration.approved recorded, declines another with a required reason recording caller registration.declined plus service registration.cancelled audit entries, and administrative cancellation records registration.admin_cancelled."
covers = ["R8", "R14", "R15"]
after = [6, 15]
hitl = false
risk = "high"

[[entry]]
id = 8
type = "story"
title = "Explicit waitlist promotion across full queue"
description = "Implements the officer action to promote the earliest Waitlisted Registration whose owner is still an Eligible Participant (`ParticipationFacts` Waitlist priority across the whole event queue) before the cutoff and when a seat is free, using discover, then lock (`users` row → event), then recheck, throwing `Stale` on mismatch; assigns confirmation and a 64-hex QR token, keeps `reviewed_at`, and appends `registration.promoted` in the same transaction, serialized with competing approvals."
verify = "When a seat is released, an officer clicks Promote and confirms the earliest eligible waitlisted member with a new QR token and an Activity Log entry; an IntegrationTests run of concurrent promotion and approval requests against SQL Server yields exactly one outcome per registration with no overbooking."
covers = ["R9", "R14"]
after = [7]
hitl = false
risk = "medium"

[[entry]]
id = 9
type = "story"
title = "Member self-cancellation and re-registration refusal"
description = "Enables a member to cancel their own pending, confirmed or waitlisted registration on a Published Event before the cutoff and before Valid Attendance, after an explicit confirmation warning that cancellation is final, under the owner's `users` row and then the event lock; `IRegistrationCancellationService.CancelRegistrationAsync` (`MemberRequested`) clears the QR token, releases the seat without promotion and records metadata, and re-registration is refused by the unique key."
verify = "A confirmed member cancels their registration after confirming the warning dialog, observing their seat released and QR token cleared with an Activity Log entry, and a subsequent registration attempt is refused."
covers = ["R10", "R14"]
after = [7, 15]
hitl = false
risk = "low"

[[entry]]
id = 10
type = "story"
title = "Event start cutoff enforcement and Not confirmed before cutoff status"
description = "Proves the exact Event Start Cutoff boundary with a fake `TimeProvider` in `Services.Tests` across the cutoff guards already established in entries 7, 8 and 9 (`ParticipationFacts` Event Start Cutoff passed, refused with `CutoffPassed` at or after event start in UTC), and displays pending and waitlisted registrations as 'Not confirmed before cutoff' without marking them cancelled or no-shows."
verify = "Boundary tests in Services.Tests verify with a fake TimeProvider that approval, decline, promotion, and member cancellation succeed one tick before event start and are rejected with CutoffPassed at and after event start, while pending and waitlisted registrations display as 'Not confirmed before cutoff' on status badges."
covers = ["R11"]
after = [8, 9]
hitl = false
risk = "low"

[[entry]]
id = 11
type = "story"
title = "Event cancellation with atomic registration cancellation and check-in closure"
description = "Cancels a Draft or Published Event with a reason under the event lock through `IEventLifecycleService`, refusing (`Invalid`) when `ParticipationFacts` Valid Attendance holds or a Data-layer read of certificates finds an issued row (AD-2 allows reads); then calls `IRegistrationCancellationService.CancelAllForEventAsync` (`EventCancelled`) for open registrations, sets `is_check_in_open = 0` (closing `check_in_closed_by/at` when the flag was open), records `cancelled_by`, `cancelled_at` and `cancellation_reason`, and writes one `event.cancelled` entry plus one `registration.cancelled` entry per cancelled registration in the same transaction."
verify = "An officer cancels a Published Event with a reason, observing all pending, confirmed and waitlisted registrations cancelled with QR tokens cleared, check-in closed, and one `event.cancelled` entry plus one `registration.cancelled` entry per registration recorded; cancellation is refused when valid attendance or an issued certificate exists in the database."
covers = ["R4", "R14"]
after = [4, 7, 15]
hitl = false
risk = "medium"

[[entry]]
id = 12
type = "story"
title = "Event completion closing check-in"
description = "Completes a Published Event at or after its start (injected `TimeProvider`, refused before start) under the event lock through `IEventLifecycleService`, setting status to Completed, clearing `is_check_in_open` (with `check_in_closed_by/at` as in entry 11), recording `completed_by` and `completed_at`, and writing an `event.completed` entry; this entry declares `IEventCompletionHandler` in Services and invokes every registered implementation (`IEnumerable`) inside the same transaction, with an empty list valid until epic-certificates registers one."
verify = "An officer completes an Event at or after its start time, observing status Completed, check-in closed and an Activity Log entry; an attempt before start is refused; and a test-double `IEventCompletionHandler` registered in IntegrationTests runs once inside the completion transaction, and its exception rolls completion back."
covers = ["R5", "R14"]
after = [11]
hitl = false
risk = "low"

