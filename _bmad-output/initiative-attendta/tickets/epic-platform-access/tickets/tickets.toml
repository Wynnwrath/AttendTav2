[[entry]]
id = 1
type = "story"
title = "Provisioned administrator logs in by email via Argon2id into authenticated session with active role checks"
description = "Stands up the xUnit test project and GitHub Actions CI workflow, benchmarks the Argon2id hasher to replace AES encryption, maps the MVP users table, provisions the first Administrator via setup script, and authenticates the administrator by email and password with signed expiring cookie session and role claims, enforcing per-request active/role re-validation, antiforgery on login and logout, and logout via POST while retiring the login stub, AES PasswordManager, and public Register."
verify = "An operator benchmarks Argon2id on the host, runs the setup script to provision an administrator, and logs in with email and password on the dev build, landing on the authenticated landing view with active session claims; demoting or deactivating the account in the database rejects its next request; logout succeeds only via POST with an antiforgery token; public Register is removed; and the GitHub Actions CI workflow runs green on PR."
covers = ["R3", "R4"]
after = []
hitl = true
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Canonical database schema update and EF Core mapping for all ten tables with lookup foreign keys"
description = "Updates the database schema with physical lookup tables and foreign keys replacing string check states, enforces required event-type descriptions and certificate issuer snapshots, grants append-only permissions on activity logs, and maps all ten tables and lookups in EF Core."
verify = "The canonical schema script applies cleanly to AttendTaMVP_Test and an automated integration test executes EF Core queries across all ten mapped tables and lookups against SQL Server."
covers = []
after = [1]
hitl = false
risk = "high"

