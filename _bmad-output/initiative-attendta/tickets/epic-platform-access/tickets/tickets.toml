[[entry]]
id = 7
type = "story"
title = "Management Account Request approval and rejection in caller transaction with audit"
description = "Enables Management to approve a pending request to atomically create an active user and member profile with transferred hash and audit, or reject a request with mandatory reason while clearing the hash, handling concurrent reviews idempotently with automated SQL Server concurrency tests proving zero duplicate accounts."
verify = "An officer approves a pending request and the applicant logs in as a Member with their original password; scripted SQL Server concurrency integration tests verify that parallel approval attempts on the same request yield exactly one Account and audited conflict outcomes with zero duplicate records; and rejection with a mandatory reason clears the hash."
covers = ["R2"]
after = [3, 5, 6]
hitl = false
risk = "high"

