description = "Implements the officer action to promote the earliest Waitlisted Registration whose owner is still an Eligible Participant (`ParticipationFacts` Waitlist priority across the whole event queue) before the cutoff and when a seat is free, using discover, then lock (`users` row → event), then recheck, throwing `Stale` on mismatch; assigns confirmation and a 64-hex QR token, keeps `reviewed_at`, and appends `registration.promoted` in the same transaction, serialized with competing approvals."
verify = "When a seat is released, an officer clicks Promote and confirms the earliest eligible waitlisted member with a new QR token and an Activity Log entry; an IntegrationTests run of concurrent promotion and approval requests against SQL Server yields exactly one outcome per registration with no overbooking."
covers = ["R9", "R14"]
