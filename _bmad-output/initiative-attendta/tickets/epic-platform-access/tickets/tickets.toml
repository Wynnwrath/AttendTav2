after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Caller-owned transaction unit of work and append-only Activity Log writer"
description = "Adds IUnitOfWork.ExecuteInTransactionAsync (Task and Task<T> overloads; the outermost call opens and commits one transaction on the request-scoped DbContext, nested calls join it, an exception rolls back and calls ChangeTracker.Clear before rethrow, no retry strategy). Adds DomainException(OutcomeCode, message, field?) with the eight OutcomeCodes, and translates SQL 2601 and 2627 into Duplicate in the data layer. Adds the users repository's LockUserAsync(id), a primary-key seek WITH (UPDLOCK, HOLDLOCK, ROWLOCK) that also protects the user's members row (AD-4), and the account_requests repository's LockAccountRequestAsync(id), the same way. Adds IActivityLogWriter.Append, which adds one row built from AuditActions constants and Resources templates, with field-subset JSON, the actor from ICurrentActor, refusal of passwords, hashes, QR tokens and file paths, no SaveChanges, and a throw when no transaction is open. Adds a correlation id to Serilog, moves its file paths from PathManager onto Common:SetupRoot, and deletes PathManager."
verify = "An integration test shows that a business write and its audit row commit together inside ExecuteInTransactionAsync, roll back together when the work throws, and join an outer transaction when nested; a second connection calling LockUserAsync on the same user waits until the first transaction ends. Append throws with no open transaction and refuses a password, hash, QR token or file path. A duplicate key surfaces as DomainException with Duplicate. A log line carries the correlation id, and no PathManager reference remains."
covers = ["R5"]
after = [1, 2]
hitl = false
risk = "high"

[[entry]]
id = 11
type = "story"
title = "Master-data repositories and services write inside the caller-owned transaction"
description = "Converts the mutating methods of EventTypeRepository, VenueRepository and MemberRepository to async with a CancellationToken and removes their SaveChanges calls, wraps every EventTypeService, VenueService and MemberService write in ExecuteInTransactionAsync, and replaces their InvalidDataException throws and catch blocks in the Event Type, Venue and Member controllers with DomainException outcomes. The actorUserId parameters and GetActorUserId stay until epic-master-data removes them, and the venue image store is left to epic-master-data."
verify = "A forced failure after a master-data write leaves no partial row; no repository method calls SaveChanges; and no InvalidDataException remains in EventTypeService, VenueService, MemberService or the three controllers."
covers = []
after = [2, 3]
hitl = false
risk = "high"

[[entry]]
id = 4
type = "story"
title = "Asia/Manila timezone display helper and UTC server-side time standard"
description = "Injects System.TimeProvider wherever Services or Data read the time, replaces every DateTime.Now and DateTime.UtcNow in ASI.Basecode.Services (UserService, EventTypeService, MemberService and VenueService included, since AD-11 binds all epics) with GetUtcNow() compared against stored UTC datetime2(3), and adds one shared Asia/Manila (+08:00) Razor formatter in WebApp that appends the zone label."
verify = "a Services.Tests test with a fake TimeProvider shows a service reads only the injected clock; a search of ASI.Basecode.Services finds no DateTime.Now or DateTime.UtcNow; a WebApp formatter test renders a UTC value as Asia/Manila with its label."
covers = []
after = [1, 11]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Public Account Request submission with field validation and Argon2id hash"
description = "Allows an applicant to submit an account request with student number, academic details, and password, validating field constraints and uniqueness against existing users, members, and pending requests while storing the password solely as an Argon2id hash through IPasswordHasher. Adds the page-controller outcome mapping for DomainException (ModelState or TempData with POST-redirect-GET, and HTTP status with JSON { outcome, message } for AJAX), which later epics reuse. The request is anonymous and writes no audit entry. Uniqueness is checked first and enforced by the unique and filtered indexes."
verify = "An applicant submits valid registration details and sees the submission acknowledgment page, while duplicate submissions or mismatched confirmation passwords redisplay field errors without persisting credentials."
covers = ["R1"]
after = [1, 2, 3, 4, 9]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Shared 25-row pager helper and Management Account Request queue"
description = "Delivers PageRequest, a non-generic IPagedResult implemented by PagedResult<T>, and one _Pager partial, at a fixed 25 rows with a unique-id tiebreak, filters and authorization applied before Count, page fallbacks, pager links that keep the current query string, navigation hidden for a single page, and an empty state. Applies it to the Management Account Request queue."
verify = "An authenticated officer navigates the Account Request queue and observes 25 items per page ordered by request timestamp then request id, the request time on the queue shows in Asia/Manila with its label, working previous and next controls that keep the active filter in the query string, hidden pagination on single pages, page 1 for an invalid page, the last page for an out-of-range page, and an empty state when no requests exist."
covers = ["R6"]
after = [1, 2, 4, 5, 9]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Management Account Request approval and rejection in caller transaction with audit"
description = "Management approves or rejects a pending request inside ExecuteInTransactionAsync. Locks the account_requests row through LockAccountRequestAsync, then the users row, and re-checks email and student-number uniqueness. Approval creates the user and calls MemberService.CreateMemberFromApprovedAccountRequest (epic-master-data owner) with the hash moved over. Rejection requires a reason and clears the hash. Each decision is audited through IActivityLogWriter. A second decision on a finalized request, or a losing concurrent decision, throws Stale and rolls back. Concurrency tests live in tests/ASI.Basecode.IntegrationTests."
verify = "An officer approves a pending request and the applicant logs in as a Member with their original password. Scripted SQL Server concurrency integration tests run parallel approvals on the same request: exactly one Account is created, and the losing attempts roll back with no audit row and throw Stale. Rejection with a mandatory reason clears the hash. A rejected Applicant submits a new request that is accepted; and parallel approvals that race an Account with the same email or student number leave one outcome (Stale or Duplicate) and no second Account."
covers = ["R2"]
after = [1, 2, 3, 4, 5, 6, 11]
hitl = false
risk = "high"

