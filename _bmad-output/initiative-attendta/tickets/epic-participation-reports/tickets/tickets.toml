[[entry]]
id = 4
type = "story"
title = "Frontend per-event report with summary breakdowns and participant table"
description = "Build DESIGN screen 18 from the 1.13 contracts: event selector, registration status counts, Confirmed and Valid attendee summary, rate (N/A at zero Confirmed; final only for completed events), completed-only no-shows, course/year breakdowns and a 25-row paged detail table. Until 7.1–7.3 the report reads demo data (M-13a, M-13b, M-13c) computed from the real registrations and the demo store's attendance and completion state, so its numbers agree with the dossier and scanner; no invented global metrics or exports. Own the report surface and its scoped assets. Follow docs/DESIGN.md. The event selector is the shared partial from 1.13."
verify = "An Officer selects a completed event in the demo store and sees counts, rate, no-shows, breakdowns and detail rows that agree with that event's seeded check-ins; a published event shows no final rate, a cancelled one no no-shows, and an event with zero Confirmed shows N/A; summary totals do not change with detail paging; the layout works on desktop, keyboard and phone width; nothing on screen says the data is demo data."
covers = ["R1", "R2"]
after = ["1.13", "1.14"]
hitl = false
risk = "medium"
phase = "frontend"
area = "frontend"
queue = 60
references = ["docs/DESIGN.md", "_bmad-output/initiative-attendta/delivery-queue.md", "_bmad-output/initiative-attendta/demo-mock-register.md"]
notes = ["Demo phase (2026-11-06 demo rescope): frontend only. Use the real backend where a service method exists and demo data per `demo-mock-register.md` (rows M-13a, M-13b, M-13c) where it does not; nothing on screen may show that data is demo data. Add or fill this ticket's register rows in the same pull request.", "Done check: `dotnet build`, `npm run css:build` when views or styles change, and one look at the changed screen with `DemoData__Enabled=true`. No new automated tests, no per-ticket Impeccable critique or polish and no separate code-review pass; the pull request keeps green existing CI and one peer approval. Critique, polish and the full Verify line run once in 8.15."]

[[entry]]
id = 1
type = "story"
title = "Event selector and participation summary KPIs"
description = "Wire 7.4's existing report contract to coherent Management-authorized real read queries: selected-event registration status counts, Confirmed count and Valid attendees excluding invalidated attendance. Calculate the canonical ParticipationFacts rate as Valid attendees divided by Confirmed, null at zero; round only for display. Following the existing authoritative SPEC/docs/DESIGN.md presentation scope, show final attendance rate only for completed non-cancelled events, otherwise N/A/not final. No change to the underlying canonical fact or new PM override; no second report screen."
verify = "An Officer selects a real completed event and sees status counts, Confirmed/Valid attendee totals and the percentage rate match the full database dataset, with N/A at zero Confirmed. Published/cancelled events do not present a final rate; changing detail pages does not change the totals."
covers = ["R1"]
after = [4, "1.1", "1.9", "3.7"]
hitl = false
risk = "medium"
phase = "integration"
area = "backend"
queue = 390
references = ["_bmad-output/initiative-attendta/delivery-queue.md", "_bmad-output/initiative-attendta/finale-test-cases.md", "_bmad-output/initiative-attendta/demo-mock-register.md"]
notes = [
  "Wire the 7.4 presentation contract using canonical mapped attendance and ParticipationFacts; read queries can be built without waiting for the scanner/invalidation UI. Full real-attendance verification remains mandatory in 8.11. Final no-show/rate presentation follows authoritative SPEC/docs/DESIGN.md: completed, non-cancelled events; zero denominator N/A.",
  "Removes demo data M-13a (2026-11-06 demo rescope): implement the real source behind the contract the demo provider serves, delete the provider classes and their registration, and set the rows to `removed` with the commit in `demo-mock-register.md`. The screen should not change visibly. No per-ticket Impeccable critique or polish; 8.12 covers it.",
]

[[entry]]
id = 2
type = "story"
title = "Completed-event no-shows and signup snapshot attendee distributions"
description = "Extends the entry 1 report view to calculate Completed-only no-shows from ParticipationFacts (excluding pending, waitlisted, and cancelled registrations from expected attendance and no-shows; for a cancelled Event, no-shows are not shown because the No-show fact requires Completed and the rate follows AD-5 as N/A, while status counts remain visible), and derive actual-attendee course and year distributions strictly from signup snapshots while preserving inactive member history."
verify = "View a completed event and verify the no-show count equals the Confirmed registrations with no Valid Attendance (no-show fact from ParticipationFacts), with pending, waitlisted and cancelled rows excluded; view a cancelled event to confirm no-shows are omitted and rate follows AD-5; and verify course and year distributions reflect actual attendees using their signup snapshots, verifying inactive accounts/members from seeded inactive users/members rows in the test database without waiting on epic-administration."
covers = ["R1"]
after = [1, "3.11", "3.12"]
hitl = false
risk = "medium"
phase = "integration"
area = "backend"
queue = 400
