[[entry]]
id = 6
type = "story"
title = "Member membership deactivation with preview, reason and cancellation cascade"
description = "Wires 5.11's membership deactivation action to the real command; it adds no new action UI. The dialog shows the preview from entry 3 and requires a non-empty reason. Submitting runs one ExecuteInTransactionAsync under the Management policy: it locks the member's users row (which also protects the members row, AD-4), sets members.membership_status_id to inactive, calls IRegistrationCancellationService.CancelUpcomingForUserAsync(userId, MembershipDeactivated, reason) from epic-events-registration (AD-6), and appends one member.membership_deactivated Activity Log entry. It takes no app lock and leaves users.is_active unchanged. It replaces 5.11's demo membership commands."
verify = "Management opens a Member; the deactivation modal lists that member's upcoming Registrations, and submission with an empty reason is refused. With a reason entered, the membership status reads inactive, those Registrations show Cancelled with QR tokens cleared, the user can still log in, and the Activity Log holds one member.membership_deactivated entry."
covers = ["R1", "R3", "R4"]
after = [3, 5, 11, "2.6", "3.15"]
hitl = false
risk = "low"
phase = "integration"
area = "backend"
queue = 270
references = ["_bmad-output/initiative-attendta/delivery-queue.md", "_bmad-output/initiative-attendta/finale-test-cases.md", "_bmad-output/initiative-attendta/demo-mock-register.md"]
