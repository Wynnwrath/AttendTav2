[[entry]]
id = 3
type = "story"
title = "Check-in validation engine and attendance recording"
description = "Adds LockAttendanceAsync to the attendance repository (UPDLOCK, HOLDLOCK, ROWLOCK on primary key seek, AD-4). Implements the shared check-in use case behind the scanner endpoint and the manual lookup (entry 5): a Management-only POST that runs in IUnitOfWork.ExecuteInTransactionAsync, takes the owner's users row then the event through repository Lock…Async methods (AD-4), and rechecks event match, Check-in open, Confirmed status and Eligible Participant through ParticipationFacts. A Valid Attendance returns its original time and inserts nothing; an invalidated attendance is refused. Otherwise it inserts one Attendance Record (method qr_code, recorder from ICurrentActor, UTC time) and appends one attendance.recorded entry whose payload excludes qr_token (AD-7). Responds per AD-9 with an HTTP status and JSON {outcome, message}, plus participant name and student number on success (fields Deferred to e4) (delivering the validation and recording part of R4, the attendance record part of R8, and SM-4 attendance concurrency)."
verify = "Focused development check: a valid scan commits one attendance/audit row and a repeat returns its original time without another insert; an invalid/closed request cannot write. Preserve all refusal rules. Finale 8.5 adds the critical refusal matrix and real-SQL duplicate-scan race from finale-test-cases.md; 8.4 runs the complete suite with exactly one Attendance Record and one audit entry under concurrency."
