[[entry]]
id = 1
type = "story"
title = "Playwright .NET setup and certificate PDF issuance tracer"
description = "Pins Microsoft.Playwright 1.64.1 in ASI.Basecode.WebApp, with Chromium installed on the dev host, and adds the Services-side certificate renderer interface with its WebApp Playwright adapter; implements a minimal issuance path that renders the A4 landscape PDF to bytes, saves them to the temporary area, promotes them to certificates/ through IPrivateFileStore and streams the promoted file back through an authorized action that calls a Services use case, delivering the initial tracer path for R5 and R6 on the existing certificates mapping from epic-platform-access (1.2); as the tracer it intentionally skips the certificates row write, lock and audit, which arrive in entry 7."
verify = "An Officer triggers the tracer action for a Confirmed Registration row inserted by a test SQL fixture; the action calls the issuance service, and the browser receives a landscape A4 PDF streamed as application/pdf from a relative certificates/ path whose bytes start with %PDF-."
covers = ["R5", "R6"]
after = ["1.1", "1.2", "2.2"]
hitl = true
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Fixed-template landscape A4 Razor certificate rendering with embedded fonts"
description = "Implements the fixed landscape A4 Razor certificate template in WebApp/Rendering with locally embedded Cinzel fonts, institutional branding, bindings for recipient name, Event title, Event start, issue date and the certificate number, dates formatted through the shared Asia/Manila formatter with its zone label (AD-11), and a visible development watermark until entry 3, delivering R5's fixed-template PDF part."
verify = "Rendering a certificate from the Razor template produces a landscape A4 PDF with embedded Cinzel fonts, the snapshot values, the certificate number and dates shown in Asia/Manila with a label, a visible development watermark, and no external network requests."
covers = ["R5"]
after = [1, "1.4"]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Configure official authorized signatory details"
description = "Configures the approved signatory name, title and signature image as non-secret application settings plus an embedded WebApp/Rendering asset used by the template, removes the development watermark, and delivers R5's official signatory requirement once Q1 is answered."
