[[entry]]
id = 1
type = "story"
title = "On-demand QR Pass PNG rendering and download"
description = "Adds server-side QR PNG rendering in ASI.Basecode.WebApp/Rendering with no System.Drawing, chooses and records the server QR library (net10.0-compatible, referenced from WebApp only), and adds a download action that checks ownership in Services and streams the PNG generated in memory, encoding only the 64-character token. The download control renders through e4's _PassPartial inside e3's My Events; e4 adds no action to MyEventsController (delivering R2 and the pass presentation part of R1)."
verify = "A logged-in Member opens My Events for a Confirmed Registration, clicks Download PNG, and receives a PNG that decodes to their 64-character lowercase hex token; downloading another Member's pass, an unknown registration id, or a cancelled Registration returns the same 403 Forbidden response and message."
covers = ["R1", "R2"]
after = ["3.7", "3.13"]
hitl = true
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Check-in window toggle with audit logging"
description = "Adds SetCheckInWindowAsync to e3's IEventLifecycleService (with e3's review) and a Management command that opens or closes Check-in for a Published Event at any time as a row action on the Management event list from epic-events-registration entry 1 (3.1). The command runs in one IUnitOfWork.ExecuteInTransactionAsync under the Event lock (AD-4), sets is_check_in_open and its actor columns, and appends one audit entry per toggle (event.check_in_opened / event.check_in_closed, AD-7) (delivering R3 and the check-in toggle part of R8)."
verify = "An Officer opens Check-in on a Published Event and sees it Open with actor and time shown, plus one event.check_in_opened Activity Log entry; closing it records one event.check_in_closed entry; a toggle on an unpublished, cancelled or completed event is refused and leaves the flag and the log unchanged."
covers = ["R3", "R8"]
after = ["3.1", "3.12"]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Check-in validation engine and attendance recording"
description = "Adds LockAttendanceAsync to the attendance repository (UPDLOCK, HOLDLOCK, ROWLOCK on primary key seek, AD-4). Implements the shared check-in use case behind the scanner endpoint and the manual lookup (entry 5): a Management-only POST that runs in IUnitOfWork.ExecuteInTransactionAsync, takes the owner's users row then the event through repository Lock…Async methods (AD-4), and rechecks event match, Check-in open, Confirmed status and Eligible Participant through ParticipationFacts. A Valid Attendance returns its original time and inserts nothing; an invalidated attendance is refused. Otherwise it inserts one Attendance Record (method qr_code, recorder from ICurrentActor, UTC time) and appends one attendance.recorded entry whose payload excludes qr_token (AD-7). Responds per AD-9 with an HTTP status and JSON {outcome, message}, plus participant name and student number on success (fields Deferred to e4) (delivering the validation and recording part of R4, the attendance record part of R8, and SM-4 attendance concurrency)."
verify = "Submitting a valid token for an open Published Event records one Attendance Record (qr_code) and one attendance.recorded entry, and returns name and student number. Resubmitting returns HTTP 200 with the original check-in time and inserts no row. A token whose attendance is invalidated, or that is wrong-event, ineligible, cancelled, unconfirmed, closed, unpublished, or unknown, is refused without an insert. tests/ASI.Basecode.Services.Tests covers each refusal with a fake TimeProvider and ICurrentActor (AD-17). tests/ASI.Basecode.IntegrationTests, against ATTENDTA_TEST_SQL, runs parallel connections for concurrent scans of one Registration and asserts exactly one Attendance Record and one attendance.recorded entry, with competing requests returning the existing record."
covers = ["R4", "R8"]
after = [2, "3.3", "3.7"]
hitl = false
risk = "high"

[[entry]]
id = 4
type = "story"
title = "In-browser camera QR scanner on localhost"
description = "Adds the Management door scanner page where an Officer points the laptop camera at a Confirmed Member's Pass; the scanner page also runs on the hotspot HTTPS origin in epic-release-acceptance entry 2 (no hard-coded localhost), while this entry verifies it on localhost. A browser QR decoder library chosen in this entry is served from wwwroot, with no runtime CDN (AD-14). The page reads the laptop camera and posts each decoded token to the entry 3 endpoint with the RequestVerificationToken header read from the layout meta tag (AD-8), then shows the JSON outcome and message (AD-9). Scan payloads are not logged (Consistency: Diagnostics) (delivering the camera scan interaction of R4)."
verify = "An Officer opens the scanner on localhost on a laptop webcam, points it at a Confirmed Member's QR Pass, and sees name and student number on success; presenting the same pass again shows the original check-in time; the browser network log shows no request to any host other than localhost."
covers = ["R4"]
after = [2, 3]
hitl = true
risk = "high"

[[entry]]
id = 5
type = "story"
title = "Manual check-in fallback by name and student number"
description = "Allows Management to search Confirmed participants by name or student number with 25-row pagination (AD-13) in the scanner window (EXPERIENCE.md: manual lookup lives in the Scanner window) and execute check-in recording manual_search or student_number under the entry 3 validation and lock rules (AD-4), appending an attendance.recorded Activity Log entry (delivering R5, the manual audit part of R8, and the search paging part of R9)."
verify = "An Officer searches confirmed participants by student number or name on an open event, sees a 25-row paged list, selects an attendee and clicks Check in, creating an Attendance Record with check_in_method manual_search or student_number; searching or viewing alone never inserts an attendance row."
covers = ["R5", "R8", "R9"]
after = [3, 4]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Attendance invalidation with confirmation and reason"
description = "Implements Management invalidation of an Attendance Record: a POST under the Management policy with antiforgery, in one IUnitOfWork.ExecuteInTransactionAsync that takes the owner's users row then the event (AD-4). The mandatory reason is validated inside the transaction. The use case declares IAttendanceInvalidationHandler in Services and calls every registered implementation before the write, so a Forbidden throw rolls back. It then sets invalidated_at and invalidation metadata on the retained row and appends one attendance.invalidated entry with the reason, with epic-participation-reports (and epic-certificates via the hook) as consumers of invalidated attendance. Refusal of later check-in is entry 3's rule (delivering R6 and the invalidation audit part of R8)."
verify = "An Officer invalidates an Attendance Record after entering a reason and confirming the warning; the row remains with invalidated_at set and one attendance.invalidated entry exists; a later check-in for that Registration is refused; with a test-registered IAttendanceInvalidationHandler that throws Forbidden, the row stays valid and no audit entry is written; with no handler registered (before e6 lands), invalidation commits."
covers = ["R6", "R8"]
after = [3, 5]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Member attendance view on My Events"
description = "Adds an attendance query service and attendance view-model fields to e3's My Events card, rendered inside _PassPartial, showing each Registration's Attendance state with invalidated records marked. The attendance history pages at 25 rows with its own page parameter beside e3's registrations list (AD-13, AD-14). This entry adds no check-in or correction action (delivering R7, the attendance state part of R1, and the history paging part of R9)."
verify = "A Member opens My Events and sees their valid attendance records with Asia/Manila check-in timestamps; an invalidated record is badged Invalidated with no check-in or correction actions; the attendance history pages at 25 rows with its own page control, independent of the registrations list."
covers = ["R1", "R7", "R9"]
after = [1, 6]
hitl = false
risk = "low"

[[entry]]
id = 9
type = "story"
title = "Refactor sweep"
description = "Cleanup only, scope set at its start from plans and review findings the epic deferred."
verify = "A non-builder reviews the git diff against dev, verifying no dead code, unused using directives, temporary logging, or schema drift remains and all existing automated check-in and attendance tests continue to pass."
covers = []
after = [1, 2, 3, 4, 5, 6, 7]
hitl = false
risk = "low"
