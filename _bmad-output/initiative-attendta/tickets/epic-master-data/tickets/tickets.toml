[[entry]]
id = 1
type = "story"
title = "Event Type management with required description, audit logging, and paged Tailwind list"
description = "Brings Event Type create, edit, and active toggle to the canonical schema with a required non-blank description and unique trimmed name, adding LockEventTypeAsync on EventTypeRepository and taking the event_types row lock for each write (deactivation takes the event_types row lock then reads linked events), reading the actor from ICurrentActor under the Management policy, mapping the DomainException outcomes that platform-access entry 11 introduced to field errors, stamping times from TimeProvider, logging old and new values through IActivityLogWriter, and displaying the list with the 25-row shared pager in the Tailwind shell."
verify = "An Officer creates an Event Type with a required description, sees it in the 25-row paged Tailwind table ordered by name with an id tie-break, edits its name and description, toggles its status, and verifies that each action appends an activity_logs entry with old and new values; a duplicate name or blank description is refused with a field error."
covers = ["R3", "R6", "R7"]
after = ["1.1", "1.3", "1.6", "1.11"]
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Shared IPrivateFileStore with venue, event, certificate and temporary areas and authorized photo route"
description = "Generalizes VenueImageStorage into IPrivateFileStore, declared in Services and implemented in WebApp/Storage under Common:SetupRoot outside wwwroot, with SaveAsync, CreateTemporaryPath, PromoteAsync, OpenReadAsync and Delete keyed by area: uploads/venues and uploads/events accept JPEG or PNG checked by magic bytes up to 2 MiB, certificates accepts only %PDF-, and temporary holds renderer output; filenames are server-generated GUIDs opened with CreateNew, SQL stores area-prefixed relative paths, every open and delete passes a containment check, existing venues rows are rewritten from venues/… to uploads/venues/… by an idempotent SQL script under database/ shipped in the same PR, venue photos are served only through a Management-policy action, and AGENTS.md and docs/database-setup.md are corrected from 5 MiB to 2 MiB with the new path form. Consumers: epic-events-registration entry 2 (Event Covers) and epic-certificates entries 1 and 7 (temporary and certificates areas)."
verify = "A Management-policy Officer uploads a 2 MiB JPEG venue photo that renders through the photo route; a file one byte over 2 MiB, a non-image with a .jpg name, and an anonymous photo request are each refused; an integration test promotes a temporary file into certificates and refuses a certificates write that does not start with %PDF-; a migrated venues row reading uploads/venues/… still renders; and AGENTS.md and docs/database-setup.md state 2 MiB and the uploads/venues path form."
covers = ["R5"]
after = ["1.1", "1.3"]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Venue create and edit with required photo, replacement-on-commit, and capacity guard"
description = "Implements Venue create and edit with positive capacity and a required area-prefixed photo path from IPrivateFileStore; adds LockVenueAsync on VenueRepository and takes the venues row lock before the edit; VenueService owns the replacement order (write the new file, commit inside ExecuteInTransactionAsync, delete the old file only after the commit, delete the new file if the commit fails), refuses a capacity below the participant limit of any linked draft or published Event through a Data read query, throws DomainException, and logs changes without image paths."
verify = "An Officer creates a venue with a photo and edits its details; in an IntegrationTests database where a test SQL fixture inserts a published events row with participant_limit 30 linked to the venue, an edit to capacity 29 is refused with an Invalid outcome on capacity; a second connection holding the venue lock delays the edit until it is released; a forced commit failure keeps the old photo file and removes the new one; and successful changes append activity_logs entries containing no image path."
covers = ["R4", "R5", "R6"]
after = ["1.3", "1.9", "1.11", 2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Venue paged list with photo thumbnails, active toggle, and Tailwind views"
description = "Renders the Venue management list with the 25-row shared pager ordered by room name with a venue_id tie-break, photo thumbnails loaded only through the authorized photo route, and an active toggle that takes the venues row lock via LockVenueAsync then reads linked events and appends an audit entry with old and new values, ported to the Tailwind shell under the Management policy."
verify = "An Officer views the 25-row paged Venue list with thumbnails from the authorized route, toggles a venue's active state, observes the updated status and an activity_logs entry, and a page past the end shows the last page."
covers = ["R4", "R6", "R7"]
after = ["1.6", 2, 3]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Active Event Type and Venue read queries for event lifecycle"
description = "Exposes Data-layer read queries that return only active Event Types and active Venues. epic-events-registration entry 1 calls them to refuse inactive references on new or draft Events; existing references are kept. The Eligible Participant fact is not built here (AD-5)."
verify = "An IntegrationTests run shows the active Event Type and active Venue read queries return only active rows, and an inactive type or venue is still returned by its own lookup so existing references resolve."
covers = ["R3", "R4"]
after = [1, 3]
hitl = false
risk = "low"

[[entry]]
id = 6
type = "story"
title = "Member profile edit with student-number correction reason and audit"
description = "Updates Member edit so Management changes users.full_name, course, year level, section, mobile and membership type under the users row lock, with email read-only; a student-number correction requires a reason validated inside the transaction and a unique check whose 2601/2627 failures map to Duplicate; UpdateMember no longer writes membership status, and MemberService.ToggleStatus with its controller action are removed for e5; MemberService.CreateMemberFromApprovedAccountRequest drops actorUserId; the approval call in epic-platform-access entry 7 moves to the new signature (async comes from its entry 11); it sets membership_status_id to active and stays the only member create path, called inside the e1 approval transaction; every write logs explicit old and new subsets through IActivityLogWriter."
verify = "An Officer edits a member's full name and academic fields, corrects the student number with a reason, and sees old/new values and the reason in activity_logs with no password_hash; email is read-only; the member form has no status control and no ToggleStatus action exists; a duplicate student number is refused as Duplicate on student_number; with seeded registrations and certificates rows, a member edit leaves their values unchanged; and an Account Request approval creates the member through the migrated signature."
covers = ["R2", "R6"]
after = ["1.3", "1.7", "1.9"]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Member paged list with search and Tailwind shell"
description = "Applies 25-row server-side pagination with the shared pager to the Member management list, ordered by users.full_name with a member_id tie-break, with search by name or student number, styled in the Tailwind shell; membership status is displayed read-only."
verify = "An Officer searches members by name or student number on the Tailwind Member Index, navigates pages with Previous/Next using the 25-row pager, and sees membership status displayed read-only."
covers = ["R7"]
after = ["1.6", 6]
hitl = false
risk = "low"

[[entry]]
id = 8
type = "story"
title = "Member read-only self profile with ownership authorization"
description = "Delivers a read-only Profile view for logged-in Members that reads the profile for ICurrentActor.UserId with no id route parameter, showing account, academic, and membership details with no editable controls; a request naming another member's profile is refused with the generic Forbidden outcome."
verify = "A logged-in Member opens their profile and sees account, academic, and membership details with no editable controls; a Member request to a Management member route is refused with the generic Forbidden outcome."
covers = ["R1"]
after = ["1.1", "1.9"]
hitl = false
risk = "low"

[[entry]]
id = 9
