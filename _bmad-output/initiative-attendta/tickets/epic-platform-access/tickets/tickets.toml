[[entry]]
id = 10
type = "story"
title = "Retarget solution to net10.0 LTS, remove legacy packages, stand up xUnit v3 test projects and CI container baseline"
description = "Moves every project in the solution to net10.0 and moves the ASP.NET Core, Microsoft.Extensions and EF Core packages to 10.0.x where a 10.0.x release exists (Microsoft.TypeScript.MSBuild and Microsoft.Playwright keep their own versions). Removes EFCore.BulkExtensions, System.Drawing.Common and ZXing.Net from Data, and removes Hangfire.Core and BCrypt.Net-Next wherever referenced (Services, and BCrypt also in WebApp), keeping AutoMapper 14.0.0 with NU1903 suppressed only on each AutoMapper 14.0.0 PackageReference (Services and WebApp). Stands up both xUnit v3 test projects (tests/ASI.Basecode.Services.Tests and tests/ASI.Basecode.IntegrationTests with xunit.v3) and creates the GitHub Actions CI workflow on ubuntu-latest with an mssql/server:2025-latest service container and healthcheck that runs both test projects on PR to dev."
verify = "Every csproj in the solution targets net10.0; no csproj references a removed package; the only NU1903 suppressions are on each AutoMapper 14.0.0 PackageReference (Services and WebApp); both test projects build and execute under dotnet test; the GitHub Actions workflow runs green against the SQL Server 2025 container; and the solution builds with zero warnings."
covers = []
after = []
hitl = true
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Canonical database schema update and EF Core mapping for all ten tables with lookup foreign keys"
description = "Makes database/attendta-mvp-schema.sql the single source for all ten tables: lookup tables with explicit tinyint ids and <name>_id foreign keys replace string states (users.role_id required); event_types.description is NOT NULL and seed-event-types.sql supplies descriptions; certificates.issuer_name_snapshot exists; unique keys and filtered pending-only indexes are in place; READ_COMMITTED_SNAPSHOT is ON; activity_logs has an INSTEAD OF trigger blocking UPDATE and DELETE; and the database-name guard becomes an allow-list of AttendTaMVP_Test, AttendTa_IT_* and AttendTa_Demo (applied to database/ scripts). The fluent AsiBasecodeDbContext mapping and Data/Models/Lookups enums cover all ten tables, with no EF migrations and no data annotations. MemberAccountSummary is removed and MemberRepository's join reads users through the mapped entity. Implements the integration test fixture in tests/ASI.Basecode.IntegrationTests that builds a fresh AttendTa_IT_<guid> from the canonical script for each test class, reached through ATTENDTA_TEST_SQL."
verify = "The canonical schema script applies cleanly to a fresh AttendTaMVP_Test and to an AttendTa_IT_<guid> database, and is refused in any other database name. The integration project maps and queries all ten tables and lookups through EF Core. A direct UPDATE or DELETE on activity_logs fails with the trigger error."
covers = []
after = [10]
hitl = false
risk = "high"

[[entry]]
id = 1
type = "story"
title = "Provisioned administrator logs in by email via Argon2id into authenticated session with active role checks"
description = "Retires the login stub, UserService.AuthenticateUser and AddUser, the public Register, the AES PasswordManager and SessionManager, and the JwtBearer, CustomJwtDataFormat, /api/token, TokenProviderOptions, TokenValidationParametersFactory and TokenAuthentication configuration stack, and removes the Microsoft.AspNetCore.Authentication.JwtBearer package reference from ASI.Basecode.WebApp.csproj. Replaces them with cookie authentication: claims NameIdentifier = users.user_id and Role = role code; non-persistent, 8-hour, non-sliding; Data Protection keys under Common:SetupRoot/keys; OnValidatePrincipal reloads the users row on every request and rejects an inactive or role-changed session; generic login failure; no lockout; ICurrentActor (WebApp adapter) with the Management and Administrator policies; antiforgery on login and logout. Adds IPasswordHasher writing PHC $argon2id$ strings with a fresh 16-byte salt, verified in fixed time, benchmarked on the host (Konscious.Security.Cryptography.Argon2 1.3.1 assumed). A WebApp command-line mode hashes the supplied password through IPasswordHasher (AD-15) for the setup script, since AD-1 allows no new project. Rewrites the R35 setup script database/seed-local-admin.sql to take a supplied name, email and pre-computed password hash, and write one actor_type system activity_logs row. Removes the committed TokenAuthentication:SecretKey; the connection string comes from environment variables or user-secrets."
verify = "An operator benchmarks Argon2id on the host. On a freshly built AttendTaMVP_Test, the setup script provisions one active administrator with a PHC hash and a system audit row; that administrator logs in by email, and an authenticated request to a Management-policy route returns 200 while the same request made anonymously is redirected to sign-in; deactivating or demoting the row in the database rejects the next request; logout succeeds only as POST with an antiforgery token; public Register is gone; and the test suites pass in GitHub Actions."
covers = ["R3", "R4"]
after = [2, 10]
hitl = true
risk = "high"

[[entry]]
id = 9
type = "story"
title = "Compiled Tailwind CSS pipeline and role-routed layout shell replacing Bootstrap"
description = "Pins @tailwindcss/cli 4.3.4 to compile wwwroot/css/app.css from the DESIGN.md tokens, removes Bootstrap 4.3.1 and external CDN stylesheets and scripts, safelists dynamic class names in source, serves all scripts and fonts locally, and implements the responsive role-routed navigation shell and base layouts per the visual specification that carry TempData SuccessMessage and ErrorMessage. The layout renders the RequestVerificationToken meta tag that AJAX posts send as a header (AD-8)."
verify = "The dev build compiles Tailwind CSS locally without external CDNs, renders the responsive navigation shell showing permitted routes for Administrator, Officer, and Member across desktop and mobile viewports, and removes all Bootstrap stylesheets and CDN script tags."
